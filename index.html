<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnipSync</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { text-align: center; padding: 48px; background: #1e293b; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); max-width: 560px; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    h1 span { color: #38bdf8; }
    p { font-size: 1.1rem; color: #94a3b8; line-height: 1.6; }
    .badge { display: inline-block; margin-top: 1rem; padding: 8px 16px; background: #0ea5e9; color: #fff; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Snip<span>Sync</span></h1>
    <p>Your code snippets, synchronized everywhere. Fast, secure, and always in sync.</p>
    <div class="badge">Production</div>
  </div>
</body>
</html>
